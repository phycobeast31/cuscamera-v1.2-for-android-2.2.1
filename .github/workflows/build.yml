name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sdkmanager (modern cmdline-tools) needs JDK 17, so install SDK pieces
      # BEFORE switching the job to Java 8.
      - name: Accept licenses & install legacy SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-25" "build-tools;25.0.3"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK (aapt + javac + dx)
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildfireCam-debug-apk
          path: build/WildfireCam-debug.apk
          if-no-files-found: error
